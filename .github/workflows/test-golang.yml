name: Test Microcluster

on:
  workflow_call:

jobs:
  lint:
    name: Lint
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup GO
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: sunbeam-microcluster/go.sum
      - name: Build dqlite 1.17
        run: bash .github/scripts/install-dqlite.sh
      - name: Run linters
        working-directory: ./sunbeam-microcluster
        run: make check-static

  unit-test:
    name: Unit tests
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup GO
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: sunbeam-microcluster/go.sum
      - name: Build dqlite 1.17
        run: bash .github/scripts/install-dqlite.sh
      - name: Run tests
        working-directory: ./sunbeam-microcluster
        run: make check-unit


