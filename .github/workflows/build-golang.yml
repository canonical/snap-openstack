name: Build Microcluster

on:
  workflow_call:

jobs:
  build:
    name: Build binary
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup GO
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: sunbeam-microcluster/go.sum
      - name: Build dqlite 1.17
        run: bash .github/scripts/install-dqlite.sh
      - name: Build binary
        working-directory: ./sunbeam-microcluster
        run: make build
