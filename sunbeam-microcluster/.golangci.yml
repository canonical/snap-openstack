version: "2"

linters:
  exclusions:
    paths:
      # lxd-generate output. Its header ("The code below was generated by
      # lxd-generate - DO NOT EDIT!") is not the standard "Code generated ...
      # DO NOT EDIT." form, so golangci's generated-file auto-exclusion
      # misses these files.
      - '\.mapper\.go$'
